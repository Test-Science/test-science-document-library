baseURL = 'https://research.testscience.org/'
languageCode = 'en-us'
title = 'Test Science Research Document Library'
theme = ["PaperMod"]
enableInlineShortcodes = true
ShowBreadCrumbs = true

copyright = "[© Institute for Defense Analyses](https://www.ida.org)"


[params]
        defaultTheme = 'light'
        disableThemeToggle = true
        disableScrollToTop = false
        ShowRssButtonInSectionTermList = true
        ShowShareButtons = true
        ShowFullTextinRSS = true
        hideMeta = false
        dateFormat = '2006'
        ShowPostNavLinks = true
        [params.label]
        icon = "/testsci-logo.png"
        text = "Research Document Library"
        [params.homeInfoParams]
        title = "Welcome!"
        content = "The Test Science Research Document Library comprises methodological developments, lessons learned, and training materials created with a mission to advance the theory and practice of rigorous operational and live fire test and evaluation."

[pagination]
        pagerSize = 1000 # no pagination

[taxonomies]
        year = 'year'
        area = 'areas'
        keyword = 'keywords'
        researchers = 'researchers'
        audience = 'audience'
        venue = 'venues'

# This is needed for Search page
[outputs]
        home = [ "HTML", "RSS", "JSON" ]

[[menu.main]]
          name = "Search"
          url = "/search/"
          weight = 1
[[menu.main]]
         name = "Core Research Areas"
         url = "/areas/"
          weight = 2
[[menu.main]]
          name = "Keywords"
          url = "/keywords/"
          weight = 3
[[menu.main]]
          name = "Team"
          url = "/researchers/"
          weight = 3
[[menu.main]]
          name = "Publication Year"
          url = "/year/"
          weight = 3
[[menu.main]]
         name = "Audience"
         url = "/audience/"
          weight = 3
[[menu.main]]
        name = "Venue"
        url = "/venues/"
        weight = 3
[[menu.main]]
        name = "RSS"
        url = "https://research.testscience.org/index.xml"
        weight = 9
